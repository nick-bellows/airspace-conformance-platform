[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airspace-conformance-platform"
version = "0.1.0"
description = "Event-driven airspace conformance monitoring: surveillance reports in, tracks and safety alerts out."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Nick Bellows" }]
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    # Scenarios are hand-authored and commented, which rules out JSON.
    "pyyaml>=6.0,<7",
    # The Kalman filter is 6x6 linear algebra per aircraft per second. Hand-rolled
    # matrix code at that size is a correctness risk for no gain.
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
# Kafka producer/consumer plumbing. Needed by every long-running service.
messaging = [
    "aiokafka>=0.11,<0.13",
]
# Persistence. SQLAlchemy Core (not ORM) for bulk track-point inserts; Alembic for migrations.
storage = [
    "sqlalchemy>=2.0,<3",
    "asyncpg>=0.29,<0.31",
    "alembic>=1.13,<2",
    "redis>=5.0,<7",
]
# Edge service only, so the API image does not carry torch.
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]
# Trajectory prediction. Installed only where training or inference runs.
ml = [
    "torch>=2.4,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5.0,<8",
    "hypothesis>=6.112,<7",
    "ruff>=0.6,<1",
    "types-PyYAML>=6.0,<7",
    # Required by fastapi.testclient; not a runtime dependency of any service.
    "httpx>=0.27,<1",
]
# Tests that need real infrastructure. Kept out of `dev` so the fast unit gate
# does not pull a Docker client library it never uses.
integration = [
    "testcontainers[postgres,redis]>=4.8,<5",
    "schemathesis>=3.38,<5",
    # The e2e suite connects to the WebSocket endpoint directly.
    "websockets>=13,<16",
]
all = [
    "airspace-conformance-platform[messaging,storage,api,ml,dev,integration]",
]

[project.scripts]
acp-sim = "acp.sim.cli:main"
acp-feed = "acp.services.feed.__main__:main"
acp-track = "acp.services.track.__main__:main"
acp-conformance = "acp.services.conformance.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acp = ["py.typed", "services/api/static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "eval"]

[tool.ruff.lint]
# "S" is flake8-bandit: SAST runs in the linter on every save, not only in CI.
# "BLE" catches blind `except Exception`, which is allowed in exactly two places
# (readiness probes) and must be justified with a noqa everywhere else.
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101) and use predictable values by design (S311).
"tests/**" = ["S101", "S311"]
"eval/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["acp"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["aiokafka.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires Docker (Redpanda, Postgres, Redis) via testcontainers",
    "e2e: requires the full stack running under docker compose",
    "perf: latency-budget measurement; excluded from the default run",
]

[tool.coverage.run]
source = ["acp"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
