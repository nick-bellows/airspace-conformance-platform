# Two aircraft at the same flight level, converging head-on over eastern
# Pennsylvania. Both hold heading and speed, so the loss of separation is
# geometrically certain -- this is the scenario the conflict detector is scored
# against, and the one the demo runs.
#
# Geometry: 120 NM apart at t=0, closing at 900 kt combined (450 kt each,
# reciprocal tracks). Closest approach is therefore at t = 120/900 h = 480 s.
# They are co-altitude, so the 1000 ft vertical standard is violated for the
# whole run and the 5 NM lateral standard is breached about 20 s either side of
# the crossing.
#
# Two more aircraft fly clear of the pair so the display is not just the
# conflict, and so the detector has non-conflicting traffic to *not* alert on.

scenario_id: head-on-conflict
description: Co-altitude head-on convergence at FL350, with two non-conflicting aircraft.
seed: 20260815
duration_s: 900

reference:
  lat: 40.60
  lon: -75.50

sensor:
  report_interval_s: 1.0
  position_sigma_m: 30.0
  altitude_sigma_ft: 25.0
  speed_sigma_kt: 2.0
  track_sigma_deg: 0.5
  dropout_probability: 0.02

aircraft:
  # --- the conflicting pair ---
  - icao24: a1b2c3
    callsign: ACP101
    squawk: "2000"
    initial:
      lat: 40.60
      lon: -76.81 # 60 NM west of the reference point
      altitude_ft: 35000
      ground_speed_kt: 450
      track_deg: 90 # due east

  - icao24: d4e5f6
    callsign: ACP202
    squawk: "2000"
    initial:
      lat: 40.60
      lon: -74.19 # 60 NM east of the reference point
      altitude_ft: 35000
      ground_speed_kt: 450
      track_deg: 270 # due west

  # --- traffic that must not raise an alert ---
  # Crosses the same airspace but 4000 ft above: laterally close, vertically
  # clear. A detector that ignores altitude will fire on this one.
  - icao24: 0a1b2c
    callsign: ACP303
    squawk: "2000"
    initial:
      lat: 40.10
      lon: -75.50
      altitude_ft: 39000
      ground_speed_kt: 420
      track_deg: 0 # due north; bearings are [0, 360), so north is 0 and not 360

  # Well north, co-altitude, parallel. Never converges.
  - icao24: 3d4e5f
    callsign: ACP404
    squawk: "2000"
    initial:
      lat: 41.30
      lon: -76.50
      altitude_ft: 35000
      ground_speed_kt: 440
      track_deg: 90
