# Quality gate. Mirrors `scripts/run_checks.ps1` exactly -- if the local script
# passes, this should too.
#
# Jobs are split rather than chained into one so a failure names itself in the
# checks list: "types" failing is a different signal from "contracts" failing.
# Security scanning, image build/publish, integration, e2e, kind, and the
# latency budget arrive at M5; the README milestone list says so.

name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts migrations eval conftest.py
      - run: ruff format --check src tests scripts migrations eval conftest.py

  types:
    name: types (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # Every extra, including `ml`. Services are typed against their real
      # clients, and mypy analyses `acp/ml` whether or not torch is installed --
      # so omitting `ml` here failed the job outright rather than degrading.
      # That is exactly what happened when the ML code landed: the local gate
      # passed because the dev venv had everything, and CI could not.
      - run: pip install -e ".[all]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: mypy src

  unit:
    name: unit + contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # `ml` included deliberately rather than guarding the tests with
      # importorskip: skipping would let CI green-light a build whose model
      # cannot be imported at all.
      - run: pip install -e ".[all]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pytest tests/unit tests/contract --cov=acp --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  contracts:
    name: contract schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Fails if a wire model changed without the committed schema being
      # regenerated. This is the gate that stops a producer silently breaking
      # a consumer, and it is deliberately its own check so the failure is
      # unmistakable in the checks list.
      - run: python scripts/contracts.py --check

  degradation:
    name: runs without the ml extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # Deliberately WITHOUT `ml`: no torch, no scikit-learn.
      - run: pip install -e ".[dev,messaging,storage,api]"
      # The model card and ADR 0007 both promise the system degrades to dead
      # reckoning when the model is unavailable. That promise was false while
      # torch was imported at module scope -- the service died at import rather
      # than starting. This job is the executable form of the claim.
      - name: the conformance service imports without torch
        run: python -c "import acp.services.conformance.__main__"
      - name: the predictor falls back to physics
        run: |
          python - <<'PY'
          import importlib.util, sys
          assert importlib.util.find_spec("torch") is None, "torch present; this job proves nothing"
          from acp.ml.predictor import TrajectoryPredictor
          p = TrajectoryPredictor(60.0)
          assert not p.has_model, "expected no model without the ml extra"
          print("degrades to physics:", p.version)
          PY

  integration:
    name: integration (real Kafka, Postgres, Redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[all]" --extra-index-url https://download.pytorch.org/whl/cpu
      # Testcontainers starts the same image versions deploy/compose.yml runs,
      # so a pass here says something about the stack that actually ships.
      #
      # Coverage over the two pure I/O adapters, with their own floor. The fast
      # gate used to exclude them on the promise that an integration suite would
      # cover them instead; that promise is now kept, the exclusion is gone from
      # pyproject.toml entirely, and this is what stops the adapters quietly
      # rotting behind a passing unit suite.
      - run: >-
          pytest tests/integration -v
          --cov=acp.common.messaging --cov=acp.storage.stores
          --cov-report=term-missing --cov-fail-under=75

  e2e:
    name: end to end (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[all]" --extra-index-url https://download.pytorch.org/whl/cpu
      # Brings the whole stack up and drives a scripted conflict through it.
      # The only test that would catch a broken compose file, a wrong
      # environment variable, or a service that cannot reach another.
      - run: pytest tests/e2e -v
      - name: service logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yml logs --tail 200

  perf:
    name: latency budget
    runs-on: ubuntu-latest
    # Informational. A perf budget that fails the build on a noisy shared
    # runner teaches people to ignore the job; the numbers are still printed
    # and docs/latency-budget.md records what the budget means.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[all]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pytest tests/perf -v -s

  compose:
    name: compose config + image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Syntax and reference check on the dev stack.
      - run: docker compose -f deploy/compose.yml config --quiet
      # Cheap early signal: the e2e job builds the same image, but this fails in
      # a minute rather than after the stack has been brought up.
      - run: docker build --tag acp:ci .
