# Quality gate.
#
# !! NOTHING IN THIS FILE HAS EVER RUN. !!
# This repository has no remote yet, so every job below is unexecuted code. Two
# external reviews found defects that a first run would have caught -- a
# nonexistent action ref, an image that fails its own scan, and a step that
# executes nothing. They are itemised in the README roadmap and are being fixed
# before the first push. Do not treat a green local gate as evidence about this
# file.
#
# `lint`, `types`, `unit`, and `contracts` mirror `scripts/run_checks.ps1`; the
# script has no `degradation` step because its venv has every extra installed,
# which is exactly the condition that job exists to break.
#
# Jobs are split rather than chained into one so a failure names itself in the
# checks list: "types" failing is a different signal from "contracts" failing.
#
# Ordering note: nothing here uses `needs:` except `publish`. Jobs run in
# parallel because a lint failure and a test failure are independent facts and
# a developer wants both in one run, not the second one an hour later. `publish`
# is the exception, because pushing an image that failed its own tests is the
# one ordering that actually matters.

name: quality

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. `publish` widens this for itself alone rather than
# every job in the file inheriting the ability to write packages.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts migrations eval conftest.py
      - run: ruff format --check src tests scripts migrations eval conftest.py

  types:
    name: types (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # Every extra, including `ml`. Services are typed against their real
      # clients, and mypy analyses `acp/ml` whether or not torch is installed --
      # so omitting `ml` here failed the job outright rather than degrading.
      # That is exactly what happened when the ML code landed: the local gate
      # passed because the dev venv had everything, and CI could not.
      - run: pip install -e ".[all]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: mypy src

  unit:
    name: unit + contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # `ml` included deliberately rather than guarding the tests with
      # importorskip: skipping would let CI green-light a build whose model
      # cannot be imported at all.
      - run: pip install -e ".[all]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pytest tests/unit tests/contract --cov=acp --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  contracts:
    name: contract schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # `api` as well as `dev`: `contracts.py --check` renders the OpenAPI
      # document, which imports the FastAPI app. Installing only `dev` passed
      # locally -- where the venv has everything -- and failed on the first CI
      # run with ModuleNotFoundError. Same shape as the very first CI defect an
      # external review found in this repository.
      - run: pip install -e ".[dev,api]"
      # Fails if a wire model changed without the committed schema being
      # regenerated. This is the gate that stops a producer silently breaking
      # a consumer, and it is deliberately its own check so the failure is
      # unmistakable in the checks list.
      - run: python scripts/contracts.py --check

  degradation:
    name: runs without the ml extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # Deliberately WITHOUT `ml` and WITHOUT `observability`: no torch, no
      # scikit-learn, no prometheus_client, no OpenTelemetry.
      - run: pip install -e ".[dev,messaging,storage,api]"
      # The model card and ADR 0007 both promise the system degrades to dead
      # reckoning when the model is unavailable. That promise was false while
      # torch was imported at module scope -- the service died at import rather
      # than starting. This job is the executable form of the claim.
      - name: the conformance service imports without torch
        run: python -c "import acp.services.conformance.__main__"
      - name: the predictor falls back to physics
        run: |
          python - <<'PY'
          import importlib.util, sys
          assert importlib.util.find_spec("torch") is None, "torch present; this job proves nothing"
          from acp.ml.predictor import TrajectoryPredictor
          p = TrajectoryPredictor(60.0)
          assert not p.has_model, "expected no model without the ml extra"
          print("degrades to physics:", p.version)
          PY
      # Same claim, different dependency. ADR 0010 says a service runs blind
      # rather than refusing to start when the observability stack is absent;
      # this is what stops that sentence becoming aspirational.
      - name: metrics and tracing degrade to no-ops
        run: |
          python - <<'PY'
          import importlib.util
          assert importlib.util.find_spec("prometheus_client") is None, "extra present; proves nothing"
          from acp.common.metrics import METRICS, METRICS_AVAILABLE, serve_metrics
          from acp.common.tracing import (
              TRACING_AVAILABLE,
              configure_tracing,
              consumer_span,
              current_span_context,
              current_trace_id,
              inject_headers,
              span,
          )
          assert not METRICS_AVAILABLE and not TRACING_AVAILABLE

          # Every metric family the codebase declares, exercised with the label
          # sets its real call sites use, plus every public function in
          # acp.common.tracing.
          #
          # The list is cross-checked against Metrics._NAMES rather than trusted,
          # so a metric added later fails this job instead of quietly escaping
          # it. That is not hypothetical: the first version of this step covered
          # five of twelve families while the ADR claimed it covered all of them,
          # and two external reviews caught the gap before CI ever ran.
          from acp.common.metrics import Metrics
          labels = {
              "reports_consumed": {"service": "track"},
              "messages_published": {"service": "feed", "topic": "t"},
              "track_updates_published": {"service": "track"},
              "alerts_published": {"service": "conformance", "kind": "k", "state": "NEW"},
              "messages_discarded": {"service": "track", "topic": "t"},
              "live_tracks": {"service": "track"},
              "active_alerts": {"service": "conformance"},
              "consumer_lag": {"service": "track", "topic": "t", "partition": "0"},
              "pipeline_latency": {"service": "track"},
              "scan_duration": {"service": "conformance"},
              "model_loaded": {"service": "conformance"},
              "predictions": {"service": "conformance", "source": "physics"},
          }
          assert set(labels) == set(Metrics._NAMES), (
              f"metrics added without covering them here: {set(Metrics._NAMES) - set(labels)}"
          )
          for name, kwargs in labels.items():
              handle = getattr(METRICS, name).labels(**kwargs)
              handle.inc()
              handle.set(1)
              handle.observe(0.1)
          for histogram in (METRICS.pipeline_latency, METRICS.scan_duration):
              with METRICS.time(histogram, "track"):
                  pass
          assert b"unavailable" in METRICS.render()
          assert serve_metrics(9464) is False

          # And every public function in acp.common.tracing.
          assert configure_tracing("acp-track", "http://collector:4318/v1/traces") is False
          assert inject_headers([("x", b"y")]) == [("x", b"y")]
          with span("estimate", icao24="a1b2c3"):
              pass
          with consumer_span("consume t", [("traceparent", b"whatever")], **{"m.partition": 0}):
              pass
          with span("conflict-scan", links=[current_span_context()], tracks=2):
              pass
          assert current_span_context() is None
          assert len(current_trace_id()) == 32
          print("runs blind, as documented")
          PY

  integration:
    name: integration (real Kafka, Postgres, Redis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[all]" --extra-index-url https://download.pytorch.org/whl/cpu
      # Testcontainers starts the same image versions deploy/compose.yml runs,
      # so a pass here says something about the stack that actually ships.
      #
      # Coverage over the two pure I/O adapters, with their own floor. The fast
      # gate used to exclude them on the promise that an integration suite would
      # cover them instead; that promise is now kept, the exclusion is gone from
      # pyproject.toml entirely, and this is what stops the adapters quietly
      # rotting behind a passing unit suite.
      - run: >-
          pytest tests/integration -v
          --cov=acp.common.messaging --cov=acp.storage.stores
          --cov-report=term-missing --cov-fail-under=75

  e2e:
    name: end to end (docker compose)
    runs-on: ubuntu-latest
    needs: [image]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[all]" --extra-index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: acp-image }
      - name: load the one image and prove it is the one that was built
        run: |
          docker load --input image.tar.gz
          loaded=$(docker image inspect acp:dev --format '{{.Id}}')
          test "$loaded" = "${{ needs.image.outputs.image-id }}" \
            || { echo "loaded $loaded, expected ${{ needs.image.outputs.image-id }}"; exit 1; }
      # Brings the whole stack up and drives a scripted conflict through it.
      # The only test that would catch a broken compose file, a wrong
      # environment variable, or a service that cannot reach another.
      #
      # ACP_E2E_PREBUILT stops the fixture rebuilding, so this exercises the
      # same artefact everything else does rather than a fifth build.
      - run: pytest tests/e2e -v
        env:
          ACP_E2E_PREBUILT: "1"
      - name: service logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yml logs --tail 200

  perf:
    name: latency budget
    runs-on: ubuntu-latest
    # Informational, in two layers. ACP_PERF_REPORT_ONLY makes the suite print
    # every number and relax only the wall-clock thresholds -- it still fails on
    # anything that is not a timing question. `continue-on-error` is the
    # belt-and-braces underneath.
    #
    # The budgets are a property of the code on a reference machine; a shared
    # runner is a different machine, and the first CI run of this suite measured
    # a full cycle at 401.6 ms against 248 ms locally on identical code.
    # Asserting there would make the job a coin toss.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[all]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pytest tests/perf -v -s
        env:
          ACP_PERF_REPORT_ONLY: "1"

  # ---------------------------------------------------------------------------
  # Build the image ONCE, and make every downstream job consume that exact
  # artefact.
  #
  # It used to be built four separate times -- in `security`, `compose`, `k8s`,
  # and `publish` -- on four different runners. Every `needs:` could be green
  # and the pushed image would still be a build nobody scanned, because the
  # Dockerfile uses a mutable base tag (`python:3.13-slim`) and unpinned
  # dependency ranges, so two builds of one commit are not guaranteed to contain
  # the same packages. An external review traced it; the fix is to stop building
  # more than once.
  #
  # The image ID travels as a job output and every consumer asserts it matches
  # after loading, so "same image" is checked rather than assumed.
  # ---------------------------------------------------------------------------
  image:
    name: build the image (once)
    runs-on: ubuntu-latest
    outputs:
      image-id: ${{ steps.build.outputs.image-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: build
        run: |
          docker build --tag acp:dev .
          echo "image-id=$(docker image inspect acp:dev --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
      - run: docker save acp:dev | gzip --fast > image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acp-image
          path: image.tar.gz
          retention-days: 1
          compression-level: 0 # already gzipped

  compose:
    name: compose config + security context
    runs-on: ubuntu-latest
    needs: [image]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Syntax and reference check on the dev stack.
      - run: docker compose -f deploy/compose.yml config --quiet
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: acp-image }
      - name: load the one image and prove it is the one that was built
        run: |
          docker load --input image.tar.gz
          loaded=$(docker image inspect acp:dev --format '{{.Id}}')
          test "$loaded" = "${{ needs.image.outputs.image-id }}" \
            || { echo "loaded $loaded, expected ${{ needs.image.outputs.image-id }}"; exit 1; }

      # The Kubernetes security context, checked in ten seconds instead of the
      # five minutes the `kind` job takes. Read-only root filesystem, non-root
      # UID, all capabilities dropped -- the same constraints 30-services.yaml
      # declares. The failure this catches is a library deciding to write a
      # cache directory under $HOME, which is inside the read-only root; torch
      # is the obvious candidate, and loading the trajectory model is therefore
      # the specific thing exercised here.
      #
      # `-i` is load-bearing and was missing. Without it docker leaves the
      # container's stdin closed, `python -` reads EOF, runs an empty program,
      # and exits 0 -- so this step passed while asserting nothing at all. It was
      # written from a local run that used `python -c` and did work, and never
      # watched to fail. Verified after the fix by inverting an assertion and
      # confirming the step goes red.
      - name: the image runs under the Kubernetes security context
        run: |
          docker run --rm -i --read-only --user 1001:1001 --cap-drop ALL \
            --security-opt no-new-privileges acp:dev python - <<'PY'
          from acp.common.metrics import METRICS_AVAILABLE, serve_metrics
          from acp.common.tracing import TRACING_AVAILABLE
          from acp.ml.predictor import TrajectoryPredictor

          # The shipped image is expected to carry the observability extra. If
          # it stops doing so, Prometheus scrapes a system with nothing to say
          # and nothing errors anywhere -- so it is asserted, not assumed.
          assert METRICS_AVAILABLE, "image built without prometheus_client"
          assert TRACING_AVAILABLE, "image built without opentelemetry"

          predictor = TrajectoryPredictor(60.0)
          assert predictor.has_model, "the committed model did not load in the image"
          assert serve_metrics(9464), "could not bind the metrics port"

          # No package manager in the runtime image. Both of the image's Trivy
          # findings were in pip's vendored msgpack and the base image's
          # setuptools, neither of which anything here runs; the Dockerfile
          # deletes them. This stops them coming back through a base image bump.
          import importlib.util
          import shutil

          assert shutil.which("pip") is None, "pip is back on PATH; see the Dockerfile"
          # And the bundled wheel that can recreate it. Deleting the installed
          # pip alone left `python -m venv` able to rebuild a working pip inside
          # /dev/shm under exactly these constraints -- demonstrated by a review
          # after the walkthrough had already claimed otherwise.
          assert importlib.util.find_spec("ensurepip") is None, "ensurepip can recreate pip"
          print("ok:", predictor.version)
          PY

  # ---------------------------------------------------------------------------
  # Security. Four different questions, deliberately in one job so a reviewer
  # sees one red or green mark for "is this safe to run":
  #
  #   my code        -> bandit          (SAST)
  #   my deps        -> pip-audit       (known CVEs in what actually ships)
  #   my history     -> gitleaks        (secrets, including ones already removed)
  #   my image       -> Trivy + syft    (OS/library CVEs, and a bill of materials)
  # ---------------------------------------------------------------------------
  security:
    name: security (SAST, deps, secrets, image)
    runs-on: ubuntu-latest
    needs: [image]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history. A secret that was committed and then removed is still
          # in the objects and still compromised; scanning only the tip would
          # report clean on exactly the case that matters.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # ruff already runs the flake8-bandit ruleset ("S") on every file, and
      # this overlaps it on purpose: ruff's implementation is a subset, it is
      # pinned to a different release cadence, and the run costs seconds. The
      # overlap is cheap; a gap between two tools that both claim to do SAST
      # would not be.
      - name: bandit (SAST)
        run: |
          pip install bandit
          bandit --recursive src --severity-level medium --confidence-level medium

      # Scoped away from the dev toolchain: a CVE in a linter that never runs in
      # production is noise, and a CVE in aiokafka is not.
      #
      # `scikit-learn` is installed explicitly rather than via the `ml` extra.
      # It ships in the image and an earlier version of this step omitted it
      # while the comment claimed to cover "what actually ships" -- the extra
      # was skipped wholesale for torch's sake, taking scikit-learn with it.
      # Torch really cannot be audited here, for the reason below; scikit-learn
      # always could have been.
      #
      # `ml` is left out because the CPU-only torch wheel carries a local
      # version tag (2.x.y+cpu) that does not exist on PyPI, so pip-audit cannot
      # resolve it and reports a skip rather than a result. Torch is not
      # therefore unscanned -- Trivy reads the Python packages inside the built
      # image below, which is the scan that covers it.
      #
      # `--skip-editable` for the project itself, which has no advisory feed.
      # Paired with `--strict` it would fail on that deliberate skip, so the
      # flags are not combined.
      - name: pip-audit (dependency CVEs in the shipped set)
        run: |
          pip install --upgrade pip setuptools
          pip install pip-audit
          pip install -e ".[messaging,storage,api,observability]" scikit-learn
          pip-audit --skip-editable

      # Mounted read-only: a scanner has no reason to be able to write to the
      # thing it is scanning.
      - name: gitleaks (secrets in the full history)
        run: |
          docker run --rm --volume "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

      # The image is *loaded*, not built. Scanning a second build of the same
      # commit would produce an SBOM and a CVE verdict for an artefact that was
      # never published -- the exact gap a review found here.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: acp-image }
      - name: load the one image and prove it is the one that was built
        run: |
          docker load --input image.tar.gz
          loaded=$(docker image inspect acp:dev --format '{{.Id}}')
          test "$loaded" = "${{ needs.image.outputs.image-id }}" \
            || { echo "loaded $loaded, expected ${{ needs.image.outputs.image-id }}"; exit 1; }

      # Only fixed CRITICAL/HIGH findings fail the build. An unfixed CVE in a
      # base image is real, but failing every run over something with no
      # available patch trains people to ignore the job -- which is how a
      # fixable one gets ignored too.
      - name: Trivy (image vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: acp:dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Informational. Trivy's Kubernetes checks encode opinions this stack has
      # deliberately declined (ephemeral storage, a committed dev credential),
      # both of which are argued in deploy/k8s/README.md. Failing on them would
      # mean either arguing with the tool in config or pretending the decisions
      # were not made.
      - name: Trivy (deployment misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: deploy
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table

      - name: SBOM
        uses: anchore/sbom-action@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9
        with:
          image: acp:dev
          format: spdx-json
          artifact-name: acp-sbom.spdx.json
          output-file: acp-sbom.spdx.json

  # ---------------------------------------------------------------------------
  # The manifests, applied to a real cluster. `kubectl apply --dry-run` proves
  # only that the YAML parses; this proves the pods actually start under the
  # security context they declare, which is where readOnlyRootFilesystem and a
  # non-root UID usually turn out to be wrong.
  # ---------------------------------------------------------------------------
  k8s:
    name: kubernetes (kind smoke test)
    runs-on: ubuntu-latest
    needs: [image]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: acp-image }
      - name: load the one image and prove it is the one that was built
        run: |
          docker load --input image.tar.gz
          loaded=$(docker image inspect acp:dev --format '{{.Id}}')
          test "$loaded" = "${{ needs.image.outputs.image-id }}" \
            || { echo "loaded $loaded, expected ${{ needs.image.outputs.image-id }}"; exit 1; }

      # The Kubernetes version is pinned *transitively*, by pinning the action.
      # An explicit `node_image` was worse than no pin at all: the previous
      # combination named kindest/node:v1.31.2 against an action bundling kind
      # v0.22, which predates v1.31 node images and emits a kubeadm config API
      # version 1.31 rejects. Letting the action choose the node image it ships
      # with makes that class of mismatch impossible, and the SHA pin above
      # means the version still cannot move without a deliberate edit.
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: acp

      # The manifests use `imagePullPolicy: IfNotPresent` and a tag that exists
      # nowhere. Side-loading is what makes that work without a registry.
      - name: load the image into the cluster
        run: kind load docker-image acp:dev --name acp

      # `kubectl apply` will not re-run a completed Job, so a redeploy has to
      # delete it first. Harmless on a fresh cluster; load-bearing on any second
      # apply, which is the case the previous manifests got silently wrong.
      - run: |
          kubectl -n acp delete job migrate --ignore-not-found
          kubectl apply -f deploy/k8s/

      - name: wait for infrastructure
        run: |
          kubectl -n acp rollout status deployment/redpanda --timeout=300s
          kubectl -n acp rollout status deployment/postgres --timeout=180s
          kubectl -n acp rollout status deployment/redis --timeout=120s

      - name: the migration completes
        run: kubectl -n acp wait --for=condition=complete job/migrate --timeout=180s

      - name: wait for the services
        run: |
          for deployment in feed track conformance api; do
            kubectl -n acp rollout status "deployment/$deployment" --timeout=360s
          done

      # The point of the smoke test: not "did the pods start" but "did data get
      # all the way through". The feed publishes, the tracker filters, the API
      # serves -- if any link is broken this returns an empty list.
      - name: traffic reaches the API
        run: |
          kubectl -n acp port-forward service/api 8000:8000 &
          sleep 5
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/ready
          for attempt in $(seq 1 30); do
            count=$(curl --fail --silent http://127.0.0.1:8000/v1/tracks | python -c 'import json,sys; print(len(json.load(sys.stdin)["tracks"]))')
            echo "attempt $attempt: $count tracks"
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 5
          done
          echo "no tracks reached the API within 150s"
          exit 1

      # Proves the worker metrics endpoint added in M5 is reachable in the
      # deployed topology, not only in a unit test.
      - name: worker metrics are scrapeable
        run: |
          pod=$(kubectl -n acp get pod -l app=track -o jsonpath='{.items[0].metadata.name}')
          kubectl -n acp exec "$pod" -- \
            python -c "import urllib.request; body = urllib.request.urlopen('http://127.0.0.1:9464/metrics').read().decode(); assert 'acp_reports_consumed_total' in body, body[:400]; print('metrics endpoint OK')"

      - name: cluster state on failure
        if: failure()
        run: |
          kubectl -n acp get pods -o wide
          kubectl -n acp describe pods
          kubectl -n acp logs -l app=track --tail=100 --prefix || true
          kubectl -n acp logs -l app=api --tail=100 --prefix || true

  # ---------------------------------------------------------------------------
  # CD. Publishes to GHCR on main only, behind every gate that could say the
  # image is broken.
  #
  # `needs:` is exhaustive on purpose, and was not: `integration` and `compose`
  # were missing. GitHub blocks a job only on failures among its *declared*
  # dependencies -- an unrelated red job does not stop it -- so the at-least-once
  # and idempotency guarantees, which live only in tests/integration and which
  # e2e's single happy-path run cannot catch, were not gating a release.
  #
  # `perf` is deliberately excluded: it is `continue-on-error` by design, so
  # depending on it would be theatre.
  #
  # It does NOT build. It loads the same artefact `security` scanned, `compose`
  # ran under the Kubernetes security context, `e2e` drove traffic through, and
  # `k8s` deployed to a cluster -- and asserts the image ID matches before
  # pushing. Building here would have published a fresh resolution of a mutable
  # base tag and unpinned dependency ranges: an image nobody had tested, with
  # every gate green and an SBOM describing something else.
  # ---------------------------------------------------------------------------
  publish:
    name: publish image (GHCR)
    runs-on: ubuntu-latest
    needs:
      [image, lint, types, unit, contracts, degradation, integration, compose, security, e2e, k8s]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: acp-image }
      - name: load the tested image and prove it is the one that was built
        run: |
          docker load --input image.tar.gz
          loaded=$(docker image inspect acp:dev --format '{{.Id}}')
          test "$loaded" = "${{ needs.image.outputs.image-id }}" \
            || { echo "loaded $loaded, expected ${{ needs.image.outputs.image-id }}"; exit 1; }

      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by commit SHA as well as `latest`, so a deployment can name an
      # exact build and a rollback has something to roll back to. `latest`
      # alone would make "which image is running" unanswerable.
      - name: tag and push the tested image
        run: |
          for tag in "sha-${GITHUB_SHA}" latest; do
            docker tag acp:dev "${IMAGE_NAME}:${tag}"
            docker push "${IMAGE_NAME}:${tag}"
          done
          docker image inspect "${IMAGE_NAME}:latest" \
            --format 'published {{index .RepoDigests 0}}'
