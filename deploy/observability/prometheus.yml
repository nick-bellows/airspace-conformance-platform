# Scrape configuration for the development stack.
#
# The API serves /metrics on its own HTTP port because it already has one. The
# three worker services do not: they consume Kafka and publish to it, and have
# no HTTP surface of their own. They start a small exposition server on a
# background thread (ACP_METRICS_PORT, default 9464) purely so their counters
# can be reached.
#
# The alternative was to leave them unscrapeable and write the gap down. That
# was rejected: instrumented-but-unreachable counters look like observability
# while being useless, which is worse than no instrumentation at all.
#
# One port number serves all three because each runs in its own network
# namespace. Under compose the container name disambiguates them; in Kubernetes
# the pod IP does.

global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: acp-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api

  # The three workers, discovered by DNS rather than named as static targets.
  #
  # This is not a stylistic preference. A `static_configs` entry of
  # `track:9464` is ONE target with one `instance` label, however many replicas
  # answer that name: Docker's DNS round-robins the connection, so Prometheus
  # scrapes whichever container it happens to reach and stores the result under
  # a single series identity. `docker compose up --scale track=3` would then
  # produce a dashboard showing one replica's partial picture while appearing to
  # show all three.
  #
  # That matters because the live-track panel *sums* across replicas. An earlier
  # verification of that sum was run against a single replica, where sum and max
  # are trivially identical, so it proved nothing about the case it was fixing.
  # An external review caught both the config and the hollow verification.
  #
  # `dns_sd_configs` with type A resolves every address behind the name into its
  # own target, which is what makes the sum real.
  - job_name: acp-workers
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["feed", "track", "conformance"]
        type: A
        port: 9464
        refresh_interval: 10s
    relabel_configs:
      # The discovered name is the compose service; keep it as `service` so the
      # dashboard can select on it. `__meta_dns_name` is the name that was
      # queried, not the individual container, so replicas of one service share
      # it -- which is exactly the grouping the panels want.
      - source_labels: [__meta_dns_name]
        target_label: service
      # And keep the resolved address as the instance, so two replicas of one
      # service are two series rather than one.
      - source_labels: [__address__]
        target_label: instance

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
