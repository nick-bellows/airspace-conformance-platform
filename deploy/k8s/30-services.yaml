# The four application services, plus the migration that must run before any of
# them touches Postgres.
#
# Every pod runs as the non-root user baked into the image, with a read-only
# root filesystem and all capabilities dropped. Those are cheap to set at the
# start and expensive to retrofit once something has started writing to /tmp.
#
# CPU requests are sized for the traffic this stack actually carries -- four
# aircraft at 1 Hz -- not for the 500-aircraft figure in the latency budget.
# They were originally set from the latter, which totalled about 1250m of
# requests; on a two-core runner, with kube-system already holding roughly
# 950m, the second tracker replica could not be scheduled at all and the `k8s`
# job failed with `Insufficient cpu`. A request is a scheduling promise, and
# promising more than the workload uses buys nothing and costs a replica.
# Limits are unchanged: they cap burst and play no part in scheduling.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: acp
  annotations:
    acp.dev/description: "Alembic upgrade head; every Postgres consumer waits on it"
    # This annotation used to claim that re-applying the manifests re-runs the
    # migration. It does not, and an external review caught the claim. A
    # completed Job stays completed; `kubectl apply` on it is a no-op, and
    # editing its pod template fails outright because the template is immutable.
    #
    # Two things fix it, and both are needed:
    #   * ttlSecondsAfterFinished below, so the Job object garbage-collects
    #     itself and a later apply creates a genuinely new one;
    #   * `kubectl delete job migrate --ignore-not-found` in the deploy
    #     procedure, for the case where a redeploy happens inside the TTL.
    #
    # And regardless of either, no Deployment now trusts the ordering: they all
    # wait on the schema themselves via an init container.
    acp.dev/rerun: "requires delete; see deploy/k8s/README.md"
spec:
  backoffLimit: 6
  # Long enough to read the logs of a failed run, short enough that a redeploy
  # the next morning creates a fresh Job rather than silently skipping it.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: { app: migrate }
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: acp:dev
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: acp-config }
            - secretRef: { name: acp-postgres }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 25m, memory: 96Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed
  namespace: acp
spec:
  replicas: 1
  selector:
    matchLabels: { app: feed }
  template:
    metadata:
      labels: { app: feed }
      # The workers have no Service in front of them -- nothing calls them, they
      # consume Kafka. Prometheus finds them by pod annotation instead, which is
      # the standard discovery route for a workload that is not addressable.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      # Kubernetes has no `depends_on`, so a Kafka client starts before the
      # broker is listening and crash-loops until it is. Harmless in principle,
      # and it pushed this service past a 240s rollout timeout on the first CI
      # run. It waits; the feed still owns topic creation.
      initContainers:
        - name: wait-for-kafka
          image: acp:dev
          imagePullPolicy: IfNotPresent
          args: ["acp-wait-for-kafka"]
          envFrom:
            - configMapRef: { name: acp-config }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 25m, memory: 96Mi }
            limits: { cpu: 250m, memory: 256Mi }
      containers:
        - name: feed
          image: acp:dev
          imagePullPolicy: IfNotPresent
          args:
            - acp-feed
            - --scenario=scenarios/head-on-conflict.yaml
            - --loop
          envFrom:
            - configMapRef: { name: acp-config }
          ports:
            - { containerPort: 9464, name: metrics }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: track
  namespace: acp
spec:
  # The one service that genuinely scales out. Reports are keyed by aircraft
  # address, so Kafka assigns partitions across the consumer group and each
  # aircraft stays with one replica, keeping its ordering. Topics are created
  # with 6 partitions, so this is useful up to 6.
  replicas: 2
  selector:
    matchLabels: { app: track }
  template:
    metadata:
      labels: { app: track }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      # Kubernetes has none of compose's `depends_on`, so the ordering it gets
      # for free is built here instead. Init containers run in sequence: the
      # broker first, then the schema.
      #
      # Neither migrates or creates anything -- they only wait. One Job owns the
      # migration and the feed owns topic creation; two replicas racing
      # `alembic upgrade head` would be worse than either of them waiting.
      initContainers:
        - name: wait-for-kafka
          image: acp:dev
          imagePullPolicy: IfNotPresent
          args: ["acp-wait-for-kafka"]
          envFrom:
            - configMapRef: { name: acp-config }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 25m, memory: 96Mi }
            limits: { cpu: 250m, memory: 256Mi }
        - name: wait-for-schema
          image: acp:dev
          imagePullPolicy: IfNotPresent
          args: ["acp-wait-for-schema"]
          envFrom:
            - configMapRef: { name: acp-config }
            - secretRef: { name: acp-postgres }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 25m, memory: 96Mi }
            limits: { cpu: 250m, memory: 256Mi }
      containers:
        - name: track
          image: acp:dev
          imagePullPolicy: IfNotPresent
          args: ["acp-track"]
          envFrom:
            - configMapRef: { name: acp-config }
            - secretRef: { name: acp-postgres }
          ports:
            - { containerPort: 9464, name: metrics }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conformance
  namespace: acp
spec:
  # Deliberately one. Every replica would hold the whole airspace picture and
  # publish duplicate alerts -- this service does not shard, and pretending
  # otherwise by raising the count would produce a visibly wrong system. See
  # docs/limitations.md.
  replicas: 1
  selector:
    matchLabels: { app: conformance }
  template:
    metadata:
      labels: { app: conformance }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9464"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      # Kubernetes has no `depends_on`, so a Kafka client starts before the
      # broker is listening and crash-loops until it is. Harmless in principle,
      # and it pushed this service past a 240s rollout timeout on the first CI
      # run. It waits; the feed still owns topic creation.
      initContainers:
        - name: wait-for-kafka
          image: acp:dev
          imagePullPolicy: IfNotPresent
          args: ["acp-wait-for-kafka"]
          envFrom:
            - configMapRef: { name: acp-config }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 25m, memory: 96Mi }
            limits: { cpu: 250m, memory: 256Mi }
      containers:
        - name: conformance
          image: acp:dev
          imagePullPolicy: IfNotPresent
          args: ["acp-conformance"]
          envFrom:
            - configMapRef: { name: acp-config }
          ports:
            - { containerPort: 9464, name: metrics }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 150m, memory: 640Mi }
            limits: { cpu: "1", memory: 1536Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: acp
spec:
  # Stateless: holds no state and consumes no Kafka, so it scales with viewers
  # independently of everything else.
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      # Same reason as the tracker: the API reads track history from Postgres,
      # so it must not start against a schema that has not caught up.
      initContainers:
        - name: wait-for-schema
          image: acp:dev
          imagePullPolicy: IfNotPresent
          args: ["acp-wait-for-schema"]
          envFrom:
            - configMapRef: { name: acp-config }
            - secretRef: { name: acp-postgres }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 25m, memory: 96Mi }
            limits: { cpu: 250m, memory: 256Mi }
      containers:
        - name: api
          image: acp:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "acp.services.api.app"]
          envFrom:
            - configMapRef: { name: acp-config }
            - secretRef: { name: acp-postgres }
          ports:
            - { containerPort: 8000, name: http }
          # Liveness checks nothing external. A readiness-style dependency check
          # here would restart the pod every time Postgres hiccupped, turning a
          # recoverable blip into a crash loop that fixes nothing.
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          # Readiness does check, so a pod with a broken dependency leaves the
          # Service without being killed.
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: acp
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
