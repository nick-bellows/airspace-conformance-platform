# Local development stack: infrastructure plus the four services.
#
# Everything binds to 127.0.0.1 only -- these are development containers with
# development credentials and must not be reachable from the network.
#
# Image tags are pinned to exact versions. "latest" would make a green CI run
# unreproducible a week later, which defeats the point of having one.
#
#   docker compose -f deploy/compose.yml up -d --build
#   open http://localhost:8000

name: acp

x-service-base: &service-base
  build:
    context: ..
    dockerfile: Dockerfile
  image: acp:dev
  environment: &service-env
    ACP_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ACP_POSTGRES_DSN: postgresql+asyncpg://acp:acp@postgres:5432/acp
    ACP_REDIS_URL: redis://redis:6379/0
    ACP_LOG_LEVEL: INFO
    # The port the three workers serve /metrics on. Not published to the host:
    # Prometheus scrapes it over the compose network, and a port on the host
    # would be exposure for no benefit. Must match deploy/observability/prometheus.yml.
    ACP_METRICS_PORT: "9464"
    # Empty by default, and deliberately so. Set it to turn tracing on:
    #
    #   ACP_OTLP_ENDPOINT=http://jaeger:4318/v1/traces \
    #     docker compose -f deploy/compose.yml --profile observability up -d
    #
    # Defaulting it to the Jaeger URL would make every service without the
    # profile running retry an export to a collector that is not there, filling
    # the logs with failures caused entirely by the default.
    ACP_OTLP_ENDPOINT: ${ACP_OTLP_ENDPOINT:-}
  restart: unless-stopped

services:
  # Kafka API without the ZooKeeper/KRaft ceremony: one binary, one container.
  # Everything the services use is plain Kafka protocol, so this is swappable
  # for Amazon MSK or a Confluent cluster without touching application code.
  redpanda:
    image: redpandadata/redpanda:v26.1.16
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
      # Two listeners: containers reach the broker as `redpanda:9092`, while a
      # developer on the host reaches it as `localhost:19092`. Advertised
      # addresses must match how each client connects or the client will be
      # redirected to a hostname it cannot resolve.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:9644:9644" # admin API, used by the healthcheck
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: acp
      # Development-only credential. The same value is committed in
      # deploy/k8s/10-config.yaml, deliberately, so both stacks run from a clean
      # checkout; gitleaks allowlists this one literal and nothing else.
      POSTGRES_PASSWORD: acp
      POSTGRES_DB: acp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `-h 127.0.0.1` is load-bearing, not decoration. Without it pg_isready
      # checks the Unix socket, and during first-boot initialisation Postgres
      # runs a temporary server that listens on the socket *only*. The check
      # therefore passes while TCP is still refused, compose declares the
      # service healthy, and `migrate` starts and dies with
      # `ConnectionRefusedError: [Errno 111]` on a cold volume -- observed, not
      # theorised. Check the interface the clients actually use.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U acp -d acp"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Holds the current airspace picture: one hash per live track, TTL-expired so
  # a stale track disappears on its own if the tracker dies.
  redis:
    image: redis:8.10
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------

  # Runs the schema to head and exits. Everything that touches Postgres waits on
  # it completing successfully, so no service can start against a stale schema.
  migrate:
    <<: *service-base
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  feed:
    <<: *service-base
    # `--loop` restarts the scenario when it ends so a demo left running does
    # not quietly go empty after fifteen minutes.
    command:
      - acp-feed
      - --scenario=${ACP_SCENARIO:-scenarios/head-on-conflict.yaml}
      - --loop
    depends_on:
      redpanda:
        condition: service_healthy

  track:
    <<: *service-base
    command: ["acp-track"]
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  conformance:
    <<: *service-base
    command: ["acp-conformance"]
    depends_on:
      redpanda:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    <<: *service-base
    command: ["python", "-m", "acp.services.api.app"]
    environment:
      <<: *service-env
      ACP_API_PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',
          timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Observability, opt-in:
  #   docker compose -f deploy/compose.yml --profile observability up -d
  #
  # Off by default because the demo does not need it and it is another 500 MB
  # of images. Turning it on requires no rebuild -- the services read
  # ACP_OTLP_ENDPOINT and export if it is set.
  # ---------------------------------------------------------------------------

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4318:4318" # OTLP/HTTP

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    environment:
      # Anonymous access so the dashboard opens with no login, which is the
      # whole point of provisioning it. The role is deliberately **Viewer**
      # rather than Admin: the dashboard is a committed artefact that the UI
      # cannot save over anyway (`allowUiUpdates: false`), so an anonymous
      # Admin would buy nothing and hand any local process the ability to add
      # datasources. Explore needs a real login; that is the intended trade.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      # No GF_SECURITY_ALLOW_EMBEDDING. Nothing embeds these panels yet, and
      # allowing framing alongside anonymous access is a clickjacking setup for
      # a feature that does not exist. Turn it on when something needs it.
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/acp.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/acp.yml:ro
      - ./observability/dashboard.json:/var/lib/grafana/dashboards/acp.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  # Opt-in web UI for inspecting topics during a demo:
  #   docker compose -f deploy/compose.yml --profile tools up -d
  redpanda-console:
    image: redpandadata/console:v3.4.0
    profiles: ["tools"]
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

volumes:
  redpanda-data:
  postgres-data:
